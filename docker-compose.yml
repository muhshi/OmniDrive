services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      PORT: 8787
      DATABASE_PATH: /app/data/omnicloud.db
    volumes:
      - omnicloud_api_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: /ws/uploads
    ports:
      - "8085:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  omnicloud_api_data:
